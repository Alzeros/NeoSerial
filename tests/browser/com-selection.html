<!doctype html><html lang="en"><meta charset="utf-8"><title>COM selection regression</title>
<body><div id="app"></div><script>window.errors = []; window.addEventListener('error', event => window.errors.push(event.message));</script><script type="module">
import '/src/app.css';
import { installReadonlyBridge } from './readonly-bridge.mjs';
import { mount, tick } from 'svelte';
import { mockIPC, mockWindows } from '@tauri-apps/api/mocks';
import { emit } from '@tauri-apps/api/event';
import ConnectionBar from '/src/components/ConnectionBar.svelte';
import { autoConnection, connectionParams, connected, windowPort } from '/src/lib/stores.svelte.ts';
import { installFrontendDiagnostics, flushFrontendDiagnostics } from '/src/lib/frontendDiagnostics.ts';
mockWindows('main');
window.comTest = { tick, connectionParams, connected, autoConnection, windowPort, emit,
  calls: [], binding: null, nextBindingId: 0, deferAttempt: false, releaseAttempt() {},
  records: [], flushFrontendDiagnostics, ports: [
  { port: 'COM3', device: null },
  { port: 'COM3', device: 'USB serial device' },
  { port: 'COM8', device: 'Second device' },
] };
mockIPC(async (command, args) => {
  comTest.calls.push({ command, args: structuredClone(args) });
  if (command === 'append_frontend_diagnostics') { comTest.records.push(...args.records); return; }
  if (command === 'append_frontend_replay' || command === 'frontend_diagnostics_heartbeat') return;
  if (command === 'list_ports') return comTest.ports;
  if (command === 'get_auto_connect') return structuredClone(comTest.binding);
  if (command === 'set_auto_connect') {
    comTest.binding = args.params ? { id: ++comTest.nextBindingId, params: structuredClone(args.params) } : null;
    await emit('auto-connect-changed', structuredClone(comTest.binding));
    return structuredClone(comTest.binding);
  }
  if (command === 'auto_connect_once') {
    if (comTest.deferAttempt) {
      comTest.deferAttempt = false;
      await new Promise(resolve => { comTest.releaseAttempt = resolve; });
    }
    if (comTest.binding?.id !== args.bindingId) return false;
    connected.value = true;
    windowPort.value = comTest.binding.params.port;
    return true;
  }
  if (command === 'connect') {
    comTest.binding = null;
    connected.value = true;
    windowPort.value = args.port;
    await emit('auto-connect-changed', null);
    return;
  }
  if (command === 'disconnect') {
    comTest.binding = null;
    connected.value = false;
    windowPort.value = null;
    await emit('auto-connect-changed', null);
    return;
  }
  throw Error('Unexpected IPC: ' + command);
}, { shouldMockEvents: true });
installReadonlyBridge();
if (new URL(location.href).searchParams.has('diagnostics')) installFrontendDiagnostics();
mount(ConnectionBar, { target: document.querySelector('#app') });
</script></body></html>
