[package]
name = "neoserial"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.17"
serialport = "4.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
rfd = "0.14"

[build-dependencies]
slint-build = "1.17"

# Windows 可执行文件图标 / 版本资源
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
debug = true
