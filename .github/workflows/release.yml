name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'NeoSerial v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          # 自动生成 latest.json 供 updater endpoint 使用;NSIS 优先
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # 把 latest.json 同步到自建服务器(国内可达),作 updater 备用源
      # dl.neo.loc.cc(GitHub 不通时的保底),GitHub release 作主源
      # continue-on-error: 镜像失败不阻断 CI(release 已发布,更新仍走 GitHub)
      - name: Upload latest.json to mirror server
        continue-on-error: true
        shell: pwsh
        env:
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          try {
            # 私钥以 base64 单行字符串存 Secret(规避多行文本存入时换行/空格被改)
            # 这里 decode 还原成私钥文件
            $keyPath = Join-Path $env:RUNNER_TEMP "id_ed25519"
            $keyBytes = [System.Convert]::FromBase64String($env:SERVER_SSH_KEY_B64)
            [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
            icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null
            # 从 release 下载 latest.json
            $tag = $env:GITHUB_REF_NAME
            $dlDir = Join-Path $env:RUNNER_TEMP "dl"
            New-Item -ItemType Directory -Path $dlDir -Force | Out-Null
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "latest.json" --dir $dlDir
            $json = Join-Path $dlDir "latest.json"
            if (-not (Test-Path $json)) { throw "latest.json not found in release $tag" }
            Write-Host "Downloaded latest.json from release"
            # scp 上传(accept-new 自动信任首次连接指纹)
            scp -i $keyPath -o StrictHostKeyChecking=accept-new -P 22 $json neoserial@38.14.254.128:/var/www/neoserial/latest.json
            Write-Host "Uploaded to dl.neo.loc.cc"
          } catch {
            Write-Warning "镜像同步失败(不影响发布): $_"
            exit 1
          }

