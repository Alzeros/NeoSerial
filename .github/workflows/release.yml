name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'NeoSerial v__VERSION__'
          releaseBody: ''
          releaseDraft: false
          prerelease: false
          # 自动生成 latest.json 供 updater endpoint 使用;NSIS 优先
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # portable 版:直接取编译产物 neoserial.exe(前端 dist 已嵌入二进制,
      # 裸 exe 不依赖外部文件,Win11 预装 WebView2 即可运行)。
      # 不走 bundle 流程——与 NSIS 安装版共用同一二进制,只是分发形态不同。
      # 命名与安装版对齐:NeoSerial_{ver}_x64-portable.exe。
      # softprops/action-gh-release 原样用文件名,故先在文件系统重命名再上传。
      - name: Rename portable exe
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/neoserial.exe"
          if (-not (Test-Path $exe)) { throw "portable exe 未找到: $exe" }
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          Rename-Item $exe "NeoSerial_${ver}_x64-portable.exe"
          Write-Host "Renamed to NeoSerial_${ver}_x64-portable.exe"

      - name: Upload portable build to release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/NeoSerial_*_x64-portable.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # 把 latest.json 同步到自建服务器(国内可达),作 updater 备用源
  # 用 Linux job:Windows OpenSSH 对私钥文件权限检查过严(Bad permissions),
  # Linux 的 OpenSSH chmod 600 即可,绕开这个坑
  mirror:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download latest.json from release + scp to mirror
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
        run: |
          set -e
          # 从 release 下载 latest.json
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "latest.json" --dir /tmp
          echo "Downloaded latest.json"
          # 还原私钥(base64 decode),末尾补换行(OpenSSH 私钥要求文件末尾有 LF)
          echo "$SERVER_SSH_KEY_B64" | base64 -d > /tmp/id_ed25519
          printf '\n' >> /tmp/id_ed25519
          chmod 600 /tmp/id_ed25519
          # scp 上传
          scp -i /tmp/id_ed25519 -o StrictHostKeyChecking=accept-new -P 22 /tmp/latest.json neoserial@38.14.254.128:/var/www/neoserial/latest.json
          echo "Uploaded to dl.neo.loc.cc"
