name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend before publishing
        run: |
          npm run check
          npm run test:unit

      - name: Verify native code on Windows before publishing
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 指令联想的默认知识库接入:编译进二进制作为 settings.command_index 缺键时的默认值。
          # secrets 没配就是空串,等于不注入(用户自己在设置页填),不影响构建。
          NEOSERIAL_KB_BASE_URL: ${{ secrets.NEOSERIAL_KB_BASE_URL }}
          NEOSERIAL_KB_API_KEY: ${{ secrets.NEOSERIAL_KB_API_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'NeoSerial v__VERSION__'
          # release 说明:CI 创建 release 时写入 body。更新列表每次发布前更新,
          # 下载说明部分稳定复用(GitHub release 页会自动列出所有附件,故只做描述性指引,
          # 不写死文件名/版本号)。__VERSION__ 由 tauri-action 替换为版本号。
          releaseBody: |
            ## 新增功能

            - **串口自动重连**：在连接按钮下拉菜单中勾选后，点击“连接”生效；端口掉线后自动等待恢复，手动断开停止重连并保留勾选。重连期间的读取中断改为状态提示，不再反复弹出错误。
            - **可选的上滚暂停跟随**：在“设置 → 日志 → 编码与跟随”中控制，默认关闭；开启后，上滚暂停跟随，点击“回到最新”恢复。
            - **应用诊断日志导出**：自动保留界面操作、异常与运行状态，支持通过“设置 → 关于”或托盘右键导出，方便反馈给开发者或 AI 排查；记录仅存本机、按容量轮换，重启后仍可导出。

            ## 体验优化与修复

            - **设置页改版**：日志设置独立为一级页面，扩展列表可直接调整启用开关；统一分组、表单、主题选择和 MCP 接入布局，详细说明收进帮助提示。
            - 修复设置窗口重复打开无响应的问题，增加加载超时、重试和明确的失败提示。
            - 修复 Windows 下托盘退出时可能卡住、影响再次启动的问题。
            - 更新应用图标，增加留白并优化圆角；连接按钮与发送按钮对齐，自动重连菜单宽度与连接按钮一致。

            ## 下载

            - **安装版**（`*-setup.exe`，NSIS 安装程序）：推荐，支持自动更新
            - **免安装版**（`*-portable.exe`，裸 exe）：直接运行，无需安装，需系统已安装 WebView2（Win11 预装）
          releaseDraft: false
          prerelease: false
          # 自动生成 latest.json 供 updater endpoint 使用;NSIS 优先
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Archive frontend diagnostic symbols
        uses: actions/upload-artifact@v4
        with:
          name: frontend-symbols-${{ github.ref_name }}
          path: frontend-symbols/
          if-no-files-found: error
          retention-days: 90

      - name: Package frontend symbols for this release
        shell: pwsh
        run: Compress-Archive -Path frontend-symbols/* -DestinationPath NeoSerial-frontend-symbols.zip

      - name: Keep frontend symbols with the release
        uses: softprops/action-gh-release@v2
        with:
          files: NeoSerial-frontend-symbols.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # portable 版:直接取编译产物 neoserial.exe(前端 dist 已嵌入二进制,
      # 裸 exe 不依赖外部文件,Win11 预装 WebView2 即可运行)。
      # 不走 bundle 流程——与 NSIS 安装版共用同一二进制,只是分发形态不同。
      # 命名与安装版对齐:NeoSerial_{ver}_x64-portable.exe。
      # softprops/action-gh-release 原样用文件名,故先在文件系统重命名再上传。
      - name: Rename portable exe
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/neoserial.exe"
          if (-not (Test-Path $exe)) { throw "portable exe 未找到: $exe" }
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          Rename-Item $exe "NeoSerial_${ver}_x64-portable.exe"
          Write-Host "Renamed to NeoSerial_${ver}_x64-portable.exe"

      - name: Upload portable build to release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/NeoSerial_*_x64-portable.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # 把 latest.json + 安装包同步到自建服务器(国内可达),作 updater 主源。
  # 关键:tauri-action 生成的 latest.json 里 url 指向 GitHub release,国内直连
  # 不稳(实测超时)。这里把安装包也 scp 到镜像,并把 json 里所有 url 改写成
  # 镜像地址(https://dl.neo.loc.cc/{filename}),下载器走镜像源。
  # 用 Linux job:Windows OpenSSH 对私钥文件权限检查过严(Bad permissions),
  # Linux 的 OpenSSH chmod 600 即可,绕开这个坑。
  mirror:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Mirror latest.json + installers and rewrite URLs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
          MIRROR_HOST: ${{ secrets.MIRROR_HOST }}
          MIRROR_USER: ${{ secrets.MIRROR_USER }}
          MIRROR_PATH: ${{ secrets.MIRROR_PATH }}
          MIRROR_URL: https://dl.neo.loc.cc
        run: |
          set -e
          mkdir -p /tmp/mirror
          # 1. 从 release 下载 latest.json
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "latest.json" --dir /tmp/mirror
          echo "Downloaded latest.json"

          # 2. 提取 latest.json 里所有 url 指向的文件名(GitHub release 下载地址),
          # 去重后从 release 下载这些安装包到本地,准备 scp 到镜像。
          # url 形如 .../releases/download/{tag}/{filename},取末段文件名。
          filenames=$(jq -r '.platforms[].url' /tmp/mirror/latest.json | sed 's|.*/||' | sort -u)
          if [ -z "$filenames" ]; then
            echo "WARN: latest.json 中未找到 url,跳过安装包镜像"
          else
            for f in $filenames; do
              gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$f" --dir /tmp/mirror
              echo "Downloaded installer: $f"
            done
          fi

          # 3. 还原私钥(base64 decode),末尾补换行(OpenSSH 私钥要求文件末尾有 LF)
          echo "$SERVER_SSH_KEY_B64" | base64 -d > /tmp/id_ed25519
          printf '\n' >> /tmp/id_ed25519
          chmod 600 /tmp/id_ed25519
          SSH_OPTS="-i /tmp/id_ed25519 -o StrictHostKeyChecking=accept-new -P 22"

          # 4. scp 安装包到镜像根目录(覆盖旧文件)
          if [ -n "$filenames" ]; then
            scp $SSH_OPTS /tmp/mirror/$filenames "$MIRROR_USER@$MIRROR_HOST:$MIRROR_PATH/"
            echo "Uploaded installers to $MIRROR_PATH/"
          fi

          # 5. 改写 latest.json:把所有 url 从 GitHub release 地址替换成镜像地址。
          # 用 jq 遍历 platforms 下每个对象,对 url 保留文件名、换前缀为镜像 URL。
          jq --arg base "$MIRROR_URL" '
            .platforms |= with_entries(
              .value.url = ($base + "/" + (.value.url | split("/") | last))
            )
          ' /tmp/mirror/latest.json > /tmp/mirror/latest.json.rewritten
          mv /tmp/mirror/latest.json.rewritten /tmp/mirror/latest.json
          echo "Rewritten urls to mirror. New latest.json:"
          cat /tmp/mirror/latest.json

          # 6. scp 改写后的 latest.json 到镜像
          scp $SSH_OPTS /tmp/mirror/latest.json "$MIRROR_USER@$MIRROR_HOST:$MIRROR_PATH/latest.json"
          echo "Uploaded latest.json to $MIRROR_PATH/"
