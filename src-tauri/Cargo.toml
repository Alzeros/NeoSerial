[package]
name = "neoserial"
version = "0.2.6"
description = "NeoSerial - Serial Port Tool"
authors = ["you"]
edition = "2021"

[lib]
name = "neoserial_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.9"
crossbeam-channel = "0.5"
chrono = "0.4"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
rmcp = { version = "3.1", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["http1", "tokio"], default-features = false }
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tokio-util = "0.7"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
debug = true
# thin LTO + 单 codegen unit:跨 crate 内联(serialport 热路径、切行逻辑),
# 纯编译期优化,不影响运行行为。debug=true 保留用于崩溃排查。
lto = "thin"
codegen-units = 1
